<DOCTYPE.html>
    <html>
        <head>
            <title>LARGEST OF 2 NUMBERS</title>
        </head>
        <body>
            <h2>LARGEST OF 2 NUMBERS</h2>

            <form>
                Number 1:
                <input type = "number" name="num1" required>
                <br><br>
                Number 2:
                <input type ="number" name="num2" required>
                <br><br>
                <button type="button" onclick="FindLargest()">Compare</button>
                <br><br>
                <p id="result"></p>
                              
            </form>
            <script>
                function FindLargest() {

                    var num1 = parseFloat(document.getAnimation("num1").value);
                    var num2 = parseFloat(document.getAnimation("num2").value);
                    var result = document.getElementById("result");

                    if (num1 > num2) {
                        result.innerHTML = num1 + " is largest";
                    } else if (num2 > num1) {
                        result.innerHTML = num2 + " is largest";
                    } else {
                        document.getElementById("result").innerHTML =
                            "Both numbers are equal";

                    }
                }
            </script>

        </body>
    </html>
