<!DOCTYPE html>
<html lang="en">
<head><title>switch statment</title>
    <script type =text/javascript">
        var n = 3;
        switch (n)
        {
            case 1:
                document.write("One");
                break;
            case 2:
                document.write("Two");
                break;
            case 3:
                document.write("Three");
                break;
            default:
                document.write("Number not between 1 and 3");
        }
    </script>
</head>
<body>

</body>
</html>
