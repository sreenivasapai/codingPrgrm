<DOCTYPE html>
    <html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8">
        <title>Alert Box</title>
        <script type="text/javascript">
            function buttonAlert(){
                alert("This Is First Alert Box");
                alert("This Is Second Alert Box");
                alert("This Is Third Alert Box");
            }
        </script>
 
        <body>
            <h1>Onclick Magic</h1>
            <button type="button" name = "button" onclick = "buttonAlert()">CLICK ME </button>
        </body>
    </head>
</html>
