<!DOCTYPE html>
<html>
<head>
    <title>Natural Numbers</title>
</head>
<body>
    <script>
        function printNumbers() {
            let n = document.getElementById("num").value;
            let i = 1;
            let output = "";

            while (i <= n) {
                output += i + " ";
                i++;
            }

            document.getElementById("result").innerHTML = output;
        }
    </script>

    <form>
        Enter N: <input type="number" id="num">
        <button type="button" onclick="printNumbers()">Print</button>
    </form>
    <p id="result"></p>



</body>
</html>
