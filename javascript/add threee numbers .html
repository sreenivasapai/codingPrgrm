<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adding 2 Numbers</title>
    <script>
        function addNumbers() {
            var num1 = parseInt(document.getElementById("num1").value);
            var num2 = parseInt(document.getElementById("num2").value);
            var sum = num1 + num2;
            document.getElementById("num3").value = sum;}
            
        function subNumbers() {
            var num1 = parseInt(document.getElementById("num1").value);
            var num2 = parseInt(document.getElementById("num2").value);
            var sub = num1 - num2;
            document.getElementById("num3").value = sub;
        }
        function mulNumbers() {
            var num1 = parseInt(document.getElementById("num1").value);
            var num2 = parseInt(document.getElementById("num2").value);
            var mul = num1 * num2;
            document.getElementById("num3").value = mul;
        }
        function clearFields(){
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            document.getElementById("num3").value = "";
            document.getElementById("num1").focus();
        }
    </script>
</head>
<body>
    <h1>Adding 2 Numbers</h1>
    Enter Number 1:
    <input type="text" id="num1"><br><br>
    Enter Number 2:
    <input type="text" id="num2"><br><br>
    Result:
    <input type="text" id="num3" readonly><br><br>
    <button type="button" onclick="addNumbers()">
        ADD 2 NUMBERS
    </button>
    <button type="text" onClick="subNumbers()">SUBTRACT 2 NUMBERS</button>
    <button type="text" onClick="mulNumbers()">MULTIPLY 2 NUMBERS</button>
    <button type="text" onClick="clearFields()">CLEAR</button>
</body>

</html>
