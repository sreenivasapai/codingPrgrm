<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>

    <script>
        function addNumbers() {
            var num1 = Number(document.getElementById("num1").value);
            var num2 = Number(document.getElementById("num2").value);
            document.getElementById("num3").value = num1 + num2;
        }

        function subNumbers() {
            var num1 = Number(document.getElementById("num1").value);
            var num2 = Number(document.getElementById("num2").value);
            document.getElementById("num3").value = num1 - num2;
        }

        function mulNumbers() {
            var num1 = Number(document.getElementById("num1").value);
            var num2 = Number(document.getElementById("num2").value);
            document.getElementById("num3").value = num1 * num2;
        }

        function divNumbers() {
            var num1 = Number(document.getElementById("num1").value);
            var num2 = Number(document.getElementById("num2").value);

            if (num2 == 0)
                document.getElementById("num3").value = "Cannot divide by zero";
            else
                document.getElementById("num3").value = num1 / num2;
        }

        function clearFields() {
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            document.getElementById("num3").value = "";
            document.getElementById("num1").focus();
        }
    </script>
</head>

<body>

    <h1>Simple Calculator</h1>

    Enter Number 1:
    <input type="text" id="num1"><br><br>

    Enter Number 2:
    <input type="text" id="num2"><br><br>

    Result:
    <input type="text" id="num3" readonly><br><br>

    <button type="button" onclick="addNumbers()">ADD</button>
    <button type="button" onclick="subNumbers()">SUBTRACT</button>
    <button type="button" onclick="mulNumbers()">MULTIPLY</button>
    <button type="button" onclick="divNumbers()">DIVIDE</button>
    <button type="button" onclick="clearFields()">CLEAR</button>

</body>

</html>
