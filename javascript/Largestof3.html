<html>
    <head>
        <title>Conditinal Statements</title>
        <script type="text/javascript">
            function LargestNo()
            {
                var a=Number(document.getElementById("no1").value);
                var b=Number(document.getElementById("no2").value);
                var c=Number(document.getElementById("no3").value);

                if (a>b && a>c)
                {
                document.getElementById("res").value=a;
                }
                else if (b>a && b>c)
                {
                document.getElementById("res").value=b;
                }
                else
                {
                document.getElementById("res").value=c;  
                }
            }
            function iclear()
            {
                document.getElementById("no1").value="";
                document.getElementById("no2").value="";
                document.getElementById("no3").value="";
                document.getElementById("res").value="";
                document.getElementById("no1").focus();
            }

        </script>
    </head>
    <body>
    <form>
        Number 1 : <input type="text" id="no1"><br><br>
        Number 2 : <input type="text" id="no2"><br><br>
        Number 3 : <input type="text" id="no3"><br><br>
        Larger Number : <input type="text" id="res"><br><br>
        <button type="button" onclick="LargestNo()">Find</button>
        <button type="button" onclick="iclear()">Clear</button>
    </form>
    </body>
    </html>
