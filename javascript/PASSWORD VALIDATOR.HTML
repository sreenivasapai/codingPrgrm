<!DOCTYPE html>
<html>
<head>
    <title>Password Strength Validator</title>

    <script type="text/javascript">
        function validatePassword() {
            let password = document.getElementById("password").value;

            let pattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

            if (pattern.test(password)) {
                alert("Password is strong");
                return true;
            } else {
                alert("Password is weak. It must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, one number, and one special character.");
                return false;
            }
        }
    </script>
</head>

<body>
    <h1>Password Strength Validator</h1>

    <form onsubmit="return validatePassword()">
        <label for="password">Enter your password:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
