<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
    <script type="text/javascript">
        function Calculate(op)
        {
            var a = Number(document.getElementById("no1").value);
            var b = Number(document.getElementById("no2").value);
            var c;
            switch(op)
            {
                case "+":
                    c = a + b;
                    break;

                case "-":
                    c = a - b;
                    break;

                case "*":
                    c = a * b;
                    break;

                case "/":
                    c = a / b;
                    break;
            }
            document.getElementById("res").value = c;
        }
        function Clear()
        {
            document.getElementById("no1").value = "";
            document.getElementById("no2").value = "";
            document.getElementById("res").value = "";
            document.getElementById("no1").focus();
        }
    </script>
</head>
<body>
<h1>Simple Calculator</h1>
<form>
Enter Number 1 :
<input type="text" id="no1"><br><br>
Enter Number 2 :
<input type="text" id="no2"><br><br>
Result :
<input type="text" id="res" readonly><br><br>
<input type="button" value="+" onclick="Calculate('+')">
<input type="button" value="-" onclick="Calculate('-')">
<input type="button" value="*" onclick="Calculate('*')">
<input type="button" value="/" onclick="Calculate('/')">
<input type="button" value="Clear" onclick="Clear()">
</form>
</body>
</html>
